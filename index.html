<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Streak Manager</title>
    <meta name="description" content="Habit and streak tracker backed by a private GitHub Gist." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="locked-screen" class="locked-screen">
      <div class="unlock-card">
        <div class="lock-icon">🔒</div>
        <h1>Unlock your tracker</h1>
        <p>Enter your password to decrypt your GitHub PAT and load private habit data.</p>
        <form id="unlock-form">
          <input id="unlock-password" type="password" placeholder="Enter password" autocomplete="current-password" />
          <button type="submit" class="primary-btn">Unlock</button>
        </form>
        <div id="unlock-error" class="error-text" aria-live="polite"></div>
      </div>
    </div>

    <div id="app-shell" class="app-shell hidden">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">S</div>
          <div>
            <p class="eyebrow">Habit system</p>
            <h2>Streak Manager</h2>
          </div>
        </div>

        <div class="topbar-actions">
          <button id="add-routine-btn" class="secondary-btn" type="button">Add routine</button>
          <button id="settings-btn" class="secondary-btn" type="button">Settings</button>
          <button id="sync-btn" class="secondary-btn" type="button">Sync</button>
          <button id="export-btn" class="secondary-btn" type="button">Export</button>
          <label class="file-input-btn secondary-btn" for="import-file-input">Import</label>
          <input id="import-file-input" type="file" accept="application/json" />
          <button id="lock-btn" class="danger-btn" type="button">Lock</button>
        </div>
      </header>

      <div class="status-row">
        <span id="sync-indicator" class="sync-indicator neutral">Ready</span>
      </div>

      <main id="dashboard" class="dashboard" aria-live="polite"></main>
    </div>

    <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-panel settings-panel">
        <div class="modal-header">
          <div>
            <p class="eyebrow">Preferences</p>
            <h3>Settings</h3>
          </div>
          <button id="close-settings-btn" class="ghost-btn" type="button">Close</button>
        </div>
        <div id="settings-content" class="settings-content"></div>
      </div>
    </div>

    <div id="date-modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-panel date-panel">
        <div class="modal-header">
          <div>
            <p class="eyebrow">Date</p>
            <h3 id="date-modal-title">Pick a day</h3>
          </div>
          <button id="close-date-btn" class="ghost-btn" type="button">Close</button>
        </div>
        <div id="date-modal-body" class="date-modal-body"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
